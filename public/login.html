<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in or create a Standup Helper account" />
    <title>Standup Helper — sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-page">
    <div class="login-shell">
      <header class="login-topbar">
        <a class="brand" href="/" aria-label="Standup Helper">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>Standup Helper</span>
        </a>
        <div class="language-switcher" role="group" aria-label="Language">
          <button type="button" data-language="en" class="active">EN</button>
          <button type="button" data-language="ru">RU</button>
        </div>
      </header>

      <main class="login-main">
        <section class="login-intro">
          <p class="eyebrow" data-i18n="eyebrow">A calmer rhythm for every meeting</p>
          <h1><span data-i18n="heroLine1">Keep every voice</span><br /><span data-i18n="heroLine2">in the conversation.</span></h1>
          <p data-i18n="heroCopy">Sign in to manage participants, speaking time, and team activities.</p>
        </section>

        <section class="login-card" aria-labelledby="loginTitle">
          <div class="login-card-heading">
            <p class="section-kicker" data-i18n="accountArea">Your workspace</p>
            <h2 id="loginTitle" data-i18n="signIn">Sign in</h2>
            <p id="authModeCopy" data-i18n="signInCopy">Use your email and password to continue.</p>
          </div>

          <div class="auth-mode-switch" role="group" aria-label="Authentication mode">
            <button type="button" class="active" data-auth-mode="signIn" data-i18n="signIn">Sign in</button>
            <button type="button" data-auth-mode="signUp" data-i18n="createAccount">Create account</button>
          </div>

          <form id="loginForm" novalidate>
            <div id="nameField" class="auth-field" hidden>
              <label for="nameInput" data-i18n="displayName">Display name</label>
              <input id="nameInput" name="name" type="text" maxlength="80" autocomplete="name" />
            </div>

            <label for="emailInput" data-i18n="email">Email</label>
            <input id="emailInput" name="email" type="email" maxlength="254" autocomplete="email" required />

            <label for="passwordInput" data-i18n="password">Password</label>
            <input id="passwordInput" name="password" type="password" minlength="12" maxlength="128" autocomplete="current-password" required />

            <p id="loginMessage" class="login-message" role="alert" aria-live="polite"></p>
            <button id="loginButton" class="login-button" type="submit" data-i18n="continue">Continue</button>
          </form>

          <p class="login-session-note" data-i18n="sessionNote">Sessions last 24 hours. Email verification is not required yet.</p>
        </section>
      </main>
    </div>

    <script src="/login.js"></script>
  </body>
</html>
